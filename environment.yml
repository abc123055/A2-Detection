name: env_ruler

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python ──
  - python=3.10.20

  # ── Conda packages ──
  - pip=26.0.1
  - setuptools=82.0.1
  - wheel=0.46.3
  - packaging=26.0

  # ── Pip packages ──
  - pip:
      # ── Core ML / Deep Learning ──
      - torch==2.1.0
      - torchvision==0.16.0
      - triton==2.1.0
      - xformers==0.0.22.post7

      # ── NVIDIA CUDA (bundled with torch) ──
      - nvidia-cublas-cu12==12.1.3.1
      - nvidia-cuda-cupti-cu12==12.1.105
      - nvidia-cuda-nvrtc-cu12==12.1.105
      - nvidia-cuda-runtime-cu12==12.1.105
      - nvidia-cudnn-cu12==8.9.2.26
      - nvidia-cufft-cu12==11.0.2.54
      - nvidia-curand-cu12==10.3.2.106
      - nvidia-cusolver-cu12==11.4.5.107
      - nvidia-cusparse-cu12==12.1.0.106
      - nvidia-nccl-cu12==2.18.1
      - nvidia-nvjitlink-cu12==12.9.86
      - nvidia-nvtx-cu12==12.1.105

      # ── Hugging Face / Transformers ──
      - transformers==4.35.0
      - tokenizers==0.14.1
      - accelerate==0.24.1
      - huggingface-hub==0.17.3
      - safetensors==0.7.0
      - sentencepiece==0.1.99

      # ── Scientific Computing ──
      - numpy==1.26.4
      - scipy==1.15.3
      - pandas==2.3.3
      - scikit-learn==1.7.2

      # ── Vision ──
      - pillow==12.1.1
      - opencv-python==4.13.0.92

      # ── LLM / Attention ──
      - einops==0.7.0
      - openai==2.28.0

      # ── Networking / HTTP ──
      - requests==2.32.5
      - httpx==0.28.1
      - httpcore==1.0.9
      - h11==0.16.0
      - urllib3==2.6.3
      - certifi==2026.2.25
      - charset-normalizer==3.4.6
      - idna==3.11
      - sniffio==1.3.1
      - anyio==4.12.1

      # ── Data / Serialization ──
      - protobuf==7.34.0
      - pyyaml==6.0.3
      - jinja2==3.1.6
      - markupsafe==3.0.3
      - regex==2026.2.28
      - six==1.17.0
      - python-dateutil==2.9.0.post0
      - pytz==2026.1.post1
      - tzdata==2025.3

      # ── Typing / Validation ──
      - pydantic==2.12.5
      - pydantic-core==2.41.5
      - typing-extensions==4.15.0
      - typing-inspection==0.4.2
      - annotated-types==0.7.0
      - typeguard==4.5.1

      # ── Utilities ──
      - filelock==3.25.2
      - fsspec==2026.2.0
      - tqdm==4.67.3
      - psutil==7.2.2
      - joblib==1.5.3
      - threadpoolctl==3.6.0
      - inflect==7.5.0
      - more-itertools==10.8.0
      - distro==1.9.0
      - jiter==0.13.0
      - exceptiongroup==1.3.1

      # ── Math / Symbolic ──
      - mpmath==1.3.0
      - sympy==1.14.0
      - networkx==3.4.2
